<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9a76c4">
<title>角色生活物語・手機聯機版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f0fa;--card:#fffdfd;--text:#3e3444;--muted:#877a90;--line:#eadfee;--accent:#9a76c4;--soft:#f3eaf7;--bad:#a75f70}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eee5f6,#fbf7fa);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 12px;background:var(--soft);color:#654879;font-weight:700}button.primary{background:var(--accent);color:white}button.danger{background:#f8e8eb;color:var(--bad)}input,select{width:100%;padding:10px;border:1px solid #d9cce2;border-radius:12px}.wrap{max-width:820px;margin:auto;padding:15px}.hidden{display:none!important}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}h1,h3{margin:0}.muted{font-size:13px;color:var(--muted)}.chip{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--soft);font-size:12px}.saveList{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.save{border:1px solid var(--line);border-radius:16px;padding:11px;display:grid;grid-template-columns:64px 1fr;gap:10px;background:white}.pic{width:64px;height:80px;border-radius:12px;background:#eee5f4;overflow:hidden;display:grid;place-items:center}.pic img,.avatar img,.partnerPic img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.hero{display:grid;grid-template-columns:110px 1fr;gap:13px;align-items:center}.avatar{width:110px;height:145px;border-radius:18px;background:#ead8f3;overflow:hidden;display:grid;place-items:center;position:relative;font-size:40px}.avatar img{display:none}.hint{position:absolute;bottom:0;left:0;right:0;background:#31233a77;color:white;text-align:center;font-size:10px;padding:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.stat{text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px}.stat span{display:block;font-size:11px;color:var(--muted)}.now{margin-top:8px;padding:11px;border:1px dashed #ccb6db;border-radius:14px}.roomGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.partner{display:grid;grid-template-columns:60px 1fr;gap:9px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:14px}.partnerPic{width:60px;height:70px;border-radius:10px;background:#eee5f4;overflow:hidden;display:grid;place-items:center}.interactions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.chat{border:1px solid var(--line);border-radius:14px;min-height:150px;max-height:240px;overflow:auto;padding:9px}.msg{display:flex;margin:6px 0}.msg.me{justify-content:flex-end}.bubble{max-width:78%;background:#f0e9f5;padding:8px 10px;border-radius:13px}.msg.me .bubble{background:#eadcf4}.chatInput{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}.notice,.event{border:1px solid var(--line);border-radius:13px;padding:9px;margin-bottom:7px;background:#fffafd}.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.modal{position:fixed;inset:0;background:#2d24355e;display:flex;align-items:center;justify-content:center;padding:18px}.modalBox{width:min(500px,100%);background:white;border-radius:18px;padding:15px}.gameChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.result{text-align:center;font-weight:800;background:var(--soft);padding:12px;border-radius:12px;margin-top:10px}@media(max-width:620px){.saveList,.roomGrid,.chatInput{grid-template-columns:1fr}.hero{grid-template-columns:88px 1fr}.avatar{width:88px;height:120px}.stats{grid-template-columns:repeat(2,1fr)}.interactions{grid-template-columns:repeat(2,1fr)}}
</style>

<style id="mobile-overrides">
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{min-height:100dvh;overscroll-behavior-y:none}
.wrap{
  width:100%;
  max-width:500px;
  padding:12px 12px calc(22px + env(safe-area-inset-bottom));
}
.top{
  position:sticky;top:0;z-index:10;
  margin:0 -12px 12px;padding:10px 12px;
  background:rgba(247,241,250,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
h1{font-size:20px}
.card{border-radius:18px;padding:13px;margin-bottom:10px}
button{
  min-height:46px;
  padding:11px 13px;
  -webkit-tap-highlight-color:transparent;
}
input,select{
  min-height:46px;
  font-size:16px;
}
.saveList,.roomGrid,.chatInput{grid-template-columns:1fr!important}
.save{grid-template-columns:72px 1fr;padding:10px}
.pic{width:72px;height:92px}
.hero{
  grid-template-columns:96px 1fr!important;
  gap:11px;
}
.avatar{width:96px!important;height:132px!important}
.stats{grid-template-columns:repeat(2,1fr)!important}
.stat{padding:9px}
.partner{grid-template-columns:68px 1fr}
.partnerPic{width:68px;height:80px}
.interactions{grid-template-columns:repeat(2,1fr)!important;gap:9px}
.interactions button{min-height:52px}
.chat{
  min-height:240px;
  max-height:42dvh;
  padding:10px;
}
.bubble{max-width:86%;font-size:15px;padding:10px 12px}
.chatInput{
  position:sticky;
  bottom:calc(8px + env(safe-area-inset-bottom));
  z-index:5;
  padding-top:8px;
  background:var(--card);
}
#sendChat{width:100%}
.notice,.event{padding:11px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices button{width:100%}
.modal{
  align-items:flex-end;
  padding:0;
}
.modalBox{
  width:100%;
  max-width:500px;
  border-radius:22px 22px 0 0;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom));
}
.gameChoices{grid-template-columns:1fr!important}
.gameChoices button{min-height:50px}
#roomCode{
  font-size:18px;
  letter-spacing:3px;
  padding:7px 12px;
}
@media(min-width:700px){
  .wrap{max-width:500px}
}
</style>

</head><body><div class="wrap">
<section id="setup" class="hidden"><div class="top"><div><h1>第一次設定</h1><div class="muted">只要貼兩個 Supabase 資料。</div></div></div><div class="card"><p class="muted">先建立 Supabase 專案，執行我附的 SQL 一次，再把 Project URL 與 Publishable Key 貼進來。</p><input id="url" placeholder="Project URL"><div style="height:8px"></div><input id="key" placeholder="Publishable Key"><div style="height:8px"></div><button class="primary" id="saveSetup" style="width:100%">儲存並開始</button></div></section>
<section id="home" class="hidden"><div class="top"><div><h1>角色生活物語</h1><div class="muted">手機版・最多 5 個角色。</div></div><span class="chip">📱 手機聯機</span></div><div class="card"><div id="saveCount" class="muted"></div><div id="saveList" class="saveList"></div><div class="roomGrid" style="margin-top:10px"><input id="newName" placeholder="新角色名稱"><button class="primary" id="createChar">創建角色</button></div></div></section>
<section id="game" class="hidden"><div class="top"><button id="back">← 回首頁</button><span class="chip">第 <b id="day">1</b> 天</span></div><div class="card hero"><div class="avatar" id="avatar"><span id="emoji">🐾</span><img id="avatarImg"><span class="hint">點擊放圖片</span></div><input id="imageInput" type="file" accept="image/*" hidden><div><div><b id="name" style="font-size:22px"></b> <span class="chip">Lv.<span id="level"></span></span></div><div class="now"><b id="activity"></b><div id="activityDetail" class="muted"></div></div><div class="stats"><div class="stat"><b id="exp"></b><span>經驗</span></div><div class="stat"><b id="energy"></b><span>體力</span></div><div class="stat"><b id="mood"></b><span>心情</span></div><div class="stat"><b id="bond"></b><span>羈絆</span></div></div></div></div>
<div class="card"><b>雙人房間</b><div id="roomSetup"><div class="roomGrid" style="margin-top:8px"><div><select id="relation"><option value="lover">戀人</option><option value="bestfriend">摯友</option><option value="family">家人</option><option value="partner">搭檔</option><option value="rival">宿敵</option><option value="enemy">仇敵</option></select><button id="createRoom" class="primary" style="width:100%;margin-top:7px">建立房間</button></div><div><input id="joinCode" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" placeholder="輸入 6 位房間碼"><button id="joinRoom" style="width:100%;margin-top:7px">加入房間</button></div></div></div><div id="roomActive" class="hidden"><div style="margin-top:8px">房間碼：<span id="roomCode" class="chip"></span></div><div id="waiting" class="muted" style="margin-top:8px">等待另一位玩家加入……</div><div id="partner" class="partner hidden"><div id="partnerPic" class="partnerPic">♡</div><div><b id="partnerName"></b> <span id="relationChip" class="chip"></span><div id="partnerStatus" class="muted"></div><div id="partnerStats" class="muted"></div></div></div><div id="interactionGrid" class="interactions"></div></div></div>
<div class="card"><b>收到的互動</b><div id="inbox" style="margin-top:8px" class="muted">目前沒有互動。</div></div>
<div class="card"><b>聊天</b><div id="chat" class="chat" style="margin-top:8px"></div><div class="chatInput"><input id="chatInput" placeholder="輸入訊息"><button id="sendChat" class="primary">送出</button></div></div>
<div class="card"><b>待抉擇角色事件 <span id="eventCount" class="muted"></span></b><div id="events" style="margin-top:8px"></div></div></section></div>
<div id="gameModal" class="modal hidden"><div class="modalBox"><h3>心有靈犀</h3><div class="muted">兩人各選一個，選完才揭曉。</div><div class="gameChoices"><button data-choice="甜點店">甜點店</button><button data-choice="散步">散步</button><button data-choice="看星星">看星星</button></div><div id="gameResult" class="result">等待選擇……</div><button id="closeGame" style="width:100%;margin-top:8px">關閉</button></div></div>
<script>
const LK='role_simple_v1',SK='role_supabase_cfg';let client=null,local=JSON.parse(localStorage.getItem(LK)||'{"characters":[]}'),activeId=null,room=null,partner=null,channels=[],gameId=null;
const defs={lover:{name:'戀人',bond:1.5,exp:1.25,a:[['抱抱','抱抱你'],['約會','邀請你去約會'],['撒嬌','跑來向你撒嬌'],['分享甜點','想和你分享甜點'],['說想你','說有點想你'],['互動小遊戲','game']]},bestfriend:{name:'摯友',bond:1.35,exp:1.18,a:[['聊八卦','想找你聊八卦'],['出去玩','約你出去玩'],['分零食','分你一點零食'],['擊掌','向你伸手擊掌'],['打氣','替你加油'],['互動小遊戲','game']]},family:{name:'家人',bond:1.4,exp:1.12,a:[['一起吃飯','叫你一起吃飯'],['關心','問你今天過得怎樣'],['陪伴','想陪你待一下'],['幫忙','說要幫你做點事'],['送伴手禮','帶了小東西給你'],['互動小遊戲','game']]},partner:{name:'搭檔',bond:1.15,exp:1.3,a:[['訓練','邀請你一起訓練'],['討論計畫','想和你討論計畫'],['交換情報','來交換情報'],['掩護','表示會替你掩護'],['慶祝','邀你慶祝一下'],['互動小遊戲','game']]},rival:{name:'宿敵',bond:.8,exp:1.4,a:[['挑戰','向你發起挑戰'],['比戰績','要和你比較戰績'],['挑釁','故意來挑釁你'],['再戰','丟下一句下次再戰'],['嘴硬稱讚','嘴硬地稱讚你'],['互動小遊戲','game']]},enemy:{name:'仇敵',bond:.45,exp:1.32,a:[['下戰帖','向你下戰帖'],['嘲諷','對你冷嘲熱諷'],['正面較量','邀你正面較量'],['警告','對你發出警告'],['宣戰','表示絕對不認輸'],['互動小遊戲','game']]}};
const routines=[[0,6,'熟睡中','抱著被子安穩睡著。'],[6,7,'剛起床','還有點迷迷糊糊。'],[7,8,'吃早餐','正在吃早餐。'],[8,12,'做自己的事','工作、練習或處理今天的事。'],[12,13,'吃午餐','暫時休息吃午餐。'],[13,17,'繼續忙碌','午後繼續自己的生活。'],[17,18,'散步回家','慢慢走在回家的路上。'],[18,19,'吃晚餐','正在吃晚餐。'],[19,21,'悠閒時間','窩著休息。'],[21,22,'洗澡','洗去一天疲憊。'],[22,24,'準備睡覺','鑽進被窩準備睡了。']];
const events=[['突然想起對方',p=>`忙到一半時，你突然想起${p}。`,[['傳訊息',2],['晚點再說',0]]],['看到小禮物',p=>`你看到一樣很適合${p}的小東西。`,[['買下來',3],['拍照給他看',2],['先記住',1]]],['有點疲憊',p=>`今天有點累，也許可以找${p}說說話。`,[['找他聊聊',2],['自己休息',1]]]];
function save(){localStorage.setItem(LK,JSON.stringify(local))}function cur(){return local.characters.find(x=>x.id===activeId)}function rnow(){let h=new Date().getHours();return routines.find(r=>h>=r[0]&&h<r[1])||routines[0]}function day(c){let a=new Date(c.start+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.max(1,Math.floor((b-a)/86400000)+1)}function show(id){['setup','home','game'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function pstate(c){let r=rnow();return{name:c.name,image:c.image||'',level:c.level,energy:Math.round(c.energy),mood:Math.round(c.mood),activity:r[2],updated:Date.now()}}function clearCh(){channels.forEach(x=>client?.removeChannel(x));channels=[]}
function boot(){let x=localStorage.getItem(SK);if(!x)return show('setup');let c=JSON.parse(x);client=supabase.createClient(c.url,c.key);show('home');renderHome()}document.getElementById('saveSetup').onclick=()=>{let url=document.getElementById('url').value.trim(),key=document.getElementById('key').value.trim();if(!url||!key)return alert('兩個都要填');localStorage.setItem(SK,JSON.stringify({url,key}));location.reload()};
function renderHome(){document.getElementById('saveCount').textContent=`${local.characters.length}/5`;let b=document.getElementById('saveList');b.innerHTML='';local.characters.forEach(c=>{let d=document.createElement('div');d.className='save';d.innerHTML=`<div class="pic">${c.image?`<img src="${c.image}">`:'🐾'}</div><div><b>${esc(c.name)}</b><div class="muted">Lv.${c.level} · 第 ${day(c)} 天 ${c.roomCode?'· 房間 '+c.roomCode:''}</div><div class="actions"><button class="primary" data-open="${c.id}">進入</button><button class="danger" data-del="${c.id}">刪除</button></div></div>`;b.appendChild(d)});if(!local.characters.length)b.innerHTML='<div class="muted">還沒有角色。</div>'}document.getElementById('createChar').onclick=()=>{if(local.characters.length>=5)return alert('最多 5 個角色');let n=document.getElementById('newName').value.trim()||'新角色';local.characters.push({id:crypto.randomUUID(),name:n,level:1,exp:0,energy:90,mood:82,bond:0,image:'',start:new Date().toISOString().slice(0,10),events:[],lastEvent:Date.now(),roomCode:''});save();renderHome()};document.getElementById('saveList').onclick=e=>{if(e.target.dataset.open)openChar(e.target.dataset.open);if(e.target.dataset.del){let c=local.characters.find(x=>x.id===e.target.dataset.del);if(confirm(`刪除「${c.name}」？`)){local.characters=local.characters.filter(x=>x.id!==c.id);save();renderHome()}}};
async function openChar(id){activeId=id;show('game');renderGame();if(cur().roomCode)await loadRoom(cur().roomCode);maybeEvent()}document.getElementById('back').onclick=()=>{clearCh();activeId=null;room=null;partner=null;show('home');renderHome()};
async function code6(){for(let i=0;i<10;i++){let c=String(Math.floor(100000+Math.random()*900000)),{data}=await client.from('rooms').select('code').eq('code',c).maybeSingle();if(!data)return c}throw Error()}document.getElementById('createRoom').onclick=async()=>{let c=cur(),code=await code6(),relation=document.getElementById('relation').value,{error}=await client.from('rooms').insert({code,relation,host_char:c.id,host_state:pstate(c)});if(error)return alert(error.message);c.roomCode=code;save();loadRoom(code)};document.getElementById('joinRoom').onclick=async()=>{let c=cur(),code=document.getElementById('joinCode').value.trim(),{data:r}=await client.from('rooms').select('*').eq('code',code).maybeSingle();if(!r)return alert('找不到房間');if(r.guest_char)return alert('房間已滿');let {error}=await client.from('rooms').update({guest_char:c.id,guest_state:pstate(c)}).eq('code',code);if(error)return alert(error.message);c.roomCode=code;save();loadRoom(code)};
async function loadRoom(code){clearCh();let {data:r}=await client.from('rooms').select('*').eq('code',code).maybeSingle();if(!r)return;room=r;setPartner();renderGame();let ch=client.channel('r'+code).on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:`code=eq.${code}`},p=>{room=p.new;setPartner();renderGame()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`room_code=eq.${code}`},loadMessages).on('postgres_changes',{event:'INSERT',schema:'public',table:'interactions',filter:`room_code=eq.${code}`},loadInbox).on('postgres_changes',{event:'*',schema:'public',table:'games',filter:`room_code=eq.${code}`},()=>gameId&&refreshGame()).subscribe();channels.push(ch);loadMessages();loadInbox()}function setPartner(){let c=cur();partner=room.host_char===c.id?room.guest_state:room.host_state}async function syncState(){let c=cur();if(!room)return;let f=room.host_char===c.id?'host_state':'guest_state';await client.from('rooms').update({[f]:pstate(c)}).eq('code',room.code)}
function renderGame(){let c=cur(),r=rnow();document.getElementById('day').textContent=day(c);document.getElementById('name').textContent=c.name;document.getElementById('level').textContent=c.level;document.getElementById('exp').textContent=Math.floor(c.exp);document.getElementById('energy').textContent=Math.floor(c.energy);document.getElementById('mood').textContent=Math.floor(c.mood);document.getElementById('bond').textContent=Math.floor(c.bond);document.getElementById('activity').textContent=r[2];document.getElementById('activityDetail').textContent=r[3];let im=document.getElementById('avatarImg'),em=document.getElementById('emoji');if(c.image){im.src=c.image;im.style.display='block';em.style.display='none'}else{im.style.display='none';em.style.display='inline'}document.getElementById('roomSetup').classList.toggle('hidden',!!room);document.getElementById('roomActive').classList.toggle('hidden',!room);if(room){document.getElementById('roomCode').textContent=room.code;document.getElementById('waiting').classList.toggle('hidden',!!partner);document.getElementById('partner').classList.toggle('hidden',!partner);let g=document.getElementById('interactionGrid');g.innerHTML='';if(partner){let d=defs[room.relation];document.getElementById('partnerName').textContent=partner.name;document.getElementById('relationChip').textContent=d.name;document.getElementById('partnerStatus').textContent=partner.activity;document.getElementById('partnerStats').textContent=`Lv.${partner.level}　體力 ${partner.energy}　心情 ${partner.mood}`;document.getElementById('partnerPic').innerHTML=partner.image?`<img src="${partner.image}">`:'♡';d.a.forEach(([label,val])=>{let b=document.createElement('button');b.textContent=label;b.dataset.act=val;g.appendChild(b)})}}let eb=document.getElementById('events');eb.innerHTML='';document.getElementById('eventCount').textContent=`${c.events.length}/10`;if(!c.events.length)eb.innerHTML='<div class="muted">目前沒有事件。</div>';c.events.forEach(ev=>{let d=document.createElement('div');d.className='event';d.innerHTML=`<b>${esc(ev.title)}</b><div class="muted">${esc(ev.text)}</div><div class="choices"></div>`;ev.choices.forEach(ch=>{let b=document.createElement('button');b.textContent=ch[0];b.onclick=()=>{c.bond+=ch[1]*(room?defs[room.relation].bond:1);c.events=c.events.filter(x=>x.id!==ev.id);save();renderGame()};d.querySelector('.choices').appendChild(b)});eb.appendChild(d)})}
document.getElementById('interactionGrid').onclick=async e=>{let a=e.target.dataset.act;if(!a||!partner)return;if(a==='game')return startGame();let c=cur(),d=defs[room.relation],label=d.a.find(x=>x[1]===a)[0],to=room.host_char===c.id?room.guest_char:room.host_char;await client.from('interactions').insert({room_code:room.code,from_char:c.id,to_char:to,text:label});c.bond+=.5*d.bond;save();renderGame()};async function loadInbox(){if(!room)return;let c=cur(),{data=[]}=await client.from('interactions').select('*').eq('room_code',room.code).eq('to_char',c.id).order('created_at',{ascending:false}).limit(10),b=document.getElementById('inbox');b.innerHTML=data.length?'':'<div class="muted">目前沒有互動。</div>';data.forEach(x=>{let d=document.createElement('div');d.className='notice';d.textContent=`${partner?.name||'對方'}：${x.text}`;b.appendChild(d)})}
document.getElementById('sendChat').onclick=sendChat;document.getElementById('chatInput').onkeydown=e=>e.key==='Enter'&&sendChat();async function sendChat(){let c=cur(),i=document.getElementById('chatInput'),t=i.value.trim();if(!t||!partner)return;await client.from('messages').insert({room_code:room.code,from_char:c.id,text:t});i.value=''}async function loadMessages(){if(!room)return;let c=cur(),{data=[]}=await client.from('messages').select('*').eq('room_code',room.code).order('created_at',{ascending:true}).limit(60),b=document.getElementById('chat');b.innerHTML='';data.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.from_char===c.id?'me':'');d.innerHTML=`<div class="bubble">${esc(m.text)}</div>`;b.appendChild(d)});b.scrollTop=b.scrollHeight}
async function startGame(){let c=cur(),{data:g}=await client.from('games').insert({room_code:room.code,host_char:room.host_char,guest_char:room.guest_char}).select().single();gameId=g.id;document.getElementById('gameModal').classList.remove('hidden');refreshGame()}document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{let c=cur(),f=room.host_char===c.id?'host_choice':'guest_choice';await client.from('games').update({[f]:b.dataset.choice}).eq('id',gameId);refreshGame()});async function refreshGame(){let {data:g}=await client.from('games').select('*').eq('id',gameId).single(),c=cur(),mine=room.host_char===c.id?g.host_choice:g.guest_choice,other=room.host_char===c.id?g.guest_choice:g.host_choice,res=document.getElementById('gameResult');if(!mine)res.textContent='請選一個答案';else if(!other)res.textContent='等待對方……';else{res.textContent=mine===other?`心有靈犀！都選了「${mine}」♡`:`你選「${mine}」，對方選「${other}」`;if(mine===other){c.bond+=3*defs[room.relation].bond;save();renderGame()}}}document.getElementById('closeGame').onclick=()=>document.getElementById('gameModal').classList.add('hidden');
document.getElementById('avatar').onclick=()=>document.getElementById('imageInput').click();document.getElementById('imageInput').onchange=e=>{let c=cur(),f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=v=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),w=im.width,h=im.height,max=300;if(w>h&&w>max){h=h*max/w;w=max}else if(h>=w&&h>max){w=w*max/h;h=max}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);c.image=cv.toDataURL('image/jpeg',.6);save();syncState();renderGame()};im.src=v.target.result};rd.readAsDataURL(f)};
function maybeEvent(){let c=cur();if(c.events.length>=10||Date.now()-c.lastEvent<90000||Math.random()>.5)return;c.lastEvent=Date.now();let x=events[Math.floor(Math.random()*events.length)],p=partner?.name||'那個人';c.events.push({id:crypto.randomUUID(),title:x[0],text:x[1](p),choices:x[2]});save();renderGame()}setInterval(async()=>{let c=cur();if(!c)return,d=room?defs[room.relation]:{exp:1};c.exp+=d.exp;c.energy=Math.max(0,Math.min(100,c.energy+(new Date().getHours()<7?.8:-.1)));c.mood=Math.min(100,c.mood+.15);let need=60+c.level*25;if(c.exp>=need){c.exp-=need;c.level++}save();syncState();maybeEvent();renderGame()},60000);boot();
