<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9a76c4">
<title>角色生活物語・聯機修正版 v2</title>
<style>
:root{--bg:#f7f1fa;--card:#fffdfd;--text:#3d3343;--muted:#897b90;--line:#eadfee;--accent:#9872c0;--pink:#d899b8;--soft:#f3eaf7;--good:#668f70;--bad:#a65f70}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(#eee5f6,#fbf7fa);color:var(--text);-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
button{min-height:46px;border:0;border-radius:12px;padding:10px 12px;background:var(--soft);color:#654879;font-weight:700;cursor:pointer}
button.primary{background:var(--accent);color:white}
button.danger{background:#f8e8eb;color:var(--bad)}
input,select{width:100%;min-height:46px;border:1px solid #d9cce2;border-radius:12px;padding:10px;background:#fff;color:var(--text);font-size:16px}
.wrap{width:100%;max-width:500px;margin:auto;padding:12px 12px calc(22px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:10;margin:0 -12px 12px;padding:10px 12px;background:rgba(247,241,250,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px}
.muted{font-size:13px;color:var(--muted)}
.section{font-size:14px;font-weight:800;margin-bottom:9px}
.chip{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--soft);font-size:12px;color:#76558b}
.saveList{display:grid;gap:10px}
.save{display:grid;grid-template-columns:72px 1fr;gap:10px;border:1px solid var(--line);border-radius:17px;padding:10px;background:#fff}
.pic{width:72px;height:92px;border-radius:13px;background:#eee5f4;overflow:hidden;display:grid;place-items:center;font-size:28px}
.pic img{width:100%;height:100%;object-fit:cover}
.saveName{font-size:17px;font-weight:800}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.create{display:grid;gap:8px;margin-top:12px}
.hero{display:grid;grid-template-columns:96px 1fr;gap:11px;align-items:center}
.avatar{width:96px;height:132px;border-radius:18px;background:linear-gradient(145deg,#ead8f3,#f6dfe8);overflow:hidden;display:grid;place-items:center;position:relative;font-size:40px;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:none}
.hint{position:absolute;left:0;right:0;bottom:0;background:#31233a77;color:#fff;font-size:10px;text-align:center;padding:5px}
.now{border:1px dashed #ccb6db;background:#fbf7fd;border-radius:15px;padding:12px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}
.stat{padding:9px;border:1px solid var(--line);border-radius:13px;background:#fcf9fd;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.roomBox{display:grid;gap:9px}
.partner{display:grid;grid-template-columns:68px 1fr;gap:9px;padding:10px;border:1px solid var(--line);border-radius:15px;background:#fffafd;margin-top:10px}
.partnerPic{width:68px;height:80px;border-radius:12px;overflow:hidden;background:#eee6f3;display:grid;place-items:center}
.partnerPic img{width:100%;height:100%;object-fit:cover}
.bonus{font-size:12px;color:var(--good);margin-top:4px}
.interactions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
.interactions button{min-height:52px}
.notice,.event{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fffafd;margin-bottom:8px}
.title{font-weight:800}
.small{font-size:12px;color:var(--muted);margin-top:4px}
.chat{border:1px solid var(--line);border-radius:15px;min-height:230px;max-height:42dvh;overflow:auto;padding:10px}
.msg{display:flex;margin:7px 0}
.msg.me{justify-content:flex-end}
.bubble{max-width:86%;padding:10px 12px;border-radius:14px;background:#f1ebf6;line-height:1.5}
.msg.me .bubble{background:#eadcf4}
.chatInput{display:grid;gap:8px;margin-top:8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.modal{position:fixed;inset:0;background:#2d24355e;display:flex;align-items:flex-end;justify-content:center;z-index:30}
.modalBox{width:100%;max-width:500px;background:#fff;border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.gameChoices{display:grid;gap:8px;margin-top:12px}
.gameResult{text-align:center;font-weight:800;padding:14px;background:var(--soft);border-radius:14px;margin-top:12px}
#roomCode{font-size:18px;letter-spacing:3px;padding:7px 12px}
.relList{display:grid;gap:8px;margin-bottom:10px}
.relItem{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fffafd;display:flex;justify-content:space-between;gap:10px;align-items:center}
.relItem.active{border-color:#b99ace;background:#faf4fd}
.relItem .meta{min-width:0}
.relItem .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.relActions{display:flex;gap:6px;flex-shrink:0}
.relActions button{min-height:40px;padding:8px 10px}
.errorBox{background:#fff0f2;border:1px solid #e7bdc5;color:#8b4c5b;border-radius:14px;padding:10px;font-size:13px;margin-bottom:10px}

.drawerShade{position:fixed;inset:0;background:#2d24355c;z-index:40}.drawer{position:fixed;z-index:41;left:0;top:0;bottom:0;width:min(82vw,330px);background:#fff;padding:18px 12px;box-shadow:10px 0 30px #0002;overflow:auto}.navBtn{width:100%;text-align:left;background:transparent;margin:2px 0}.navSep{height:1px;background:var(--line);margin:8px}.barRow{margin:11px 0}.barHead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}.bar{height:12px;background:#eee7f1;border-radius:999px;overflow:hidden;margin-top:5px}.fill{height:100%;background:linear-gradient(90deg,#aa88cc,#df9dbd);border-radius:999px}.infoBtn{min-height:28px;width:28px;border-radius:50%;padding:0}.pageCard{display:none}.pageCard.active{display:block}.itemRow{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fffafd;margin-bottom:8px}.money{font-weight:800}.menuBtn{min-width:44px;font-size:21px}.redDot{display:inline-block;min-width:18px;padding:2px 5px;border-radius:999px;background:#c97891;color:white;font-size:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div id="fatal" class="errorBox hidden"></div>

<section id="home">
  <div class="top"><div><h1>角色生活物語</h1><div class="muted">手機聯機修正版 v2</div></div><span class="chip" id="net">雲端待命</span></div>
  <div class="card">
    <div class="section">角色存檔 <span id="saveCount" class="muted"></span></div>
    <div id="saveList" class="saveList"></div>
    <div class="create"><input id="newName" maxlength="20" placeholder="輸入新角色名稱"><button class="primary" id="createChar">創建角色</button></div>
  </div>
</section>

<section id="game" class="hidden">
  <div class="top"><button id="menuBtn" class="menuBtn">☰</button><b id="pageTitle">角色生活</b><span class="chip">🪙 <b id="moneyTop">0</b></span></div>

  <div class="card hero">
    <div class="avatar" id="avatar"><span id="emoji">🐾</span><img id="avatarImg"><span class="hint">點擊放圖片</span></div>
    <input type="file" accept="image/*" id="imageInput" hidden>
    <div>
      <div><b id="charName" style="font-size:22px"></b> <span class="chip">Lv.<span id="level">1</span></span></div>
      <div class="muted" style="margin-top:4px">生活第 <span id="day">1</span> 天</div>
      <div class="now"><b id="activity"></b><div id="activityDetail" class="muted"></div></div>
      <div id="bars" style="margin-top:10px">
<div class="barRow"><div class="barHead"><span>⚡ 體力</span><span><b id="energy">90</b>/100 <button class="infoBtn" data-info="energy">ⓘ</button></span></div><div class="bar"><div id="energyFill" class="fill"></div></div></div>
<div class="barRow"><div class="barHead"><span>🍙 飽食度</span><span><b id="hunger">85</b>/100 <button class="infoBtn" data-info="hunger">ⓘ</button></span></div><div class="bar"><div id="hungerFill" class="fill"></div></div></div>
<div class="barRow"><div class="barHead"><span>🌸 心情</span><span><b id="mood">82</b>/100 <button class="infoBtn" data-info="mood">ⓘ</button></span></div><div class="bar"><div id="moodFill" class="fill"></div></div></div>
<div class="barRow"><div class="barHead"><span>✨ 經驗</span><span><b id="exp">0</b> <button class="infoBtn" data-info="exp">ⓘ</button></span></div><div class="bar"><div id="expFill" class="fill"></div></div></div>
</div>
    </div>
  </div>

  <div class="card">
    <div class="section">角色關係 <span id="relationCount" class="muted">0/3</span></div>
    <div id="relationshipList" class="relList"></div>

    <div id="roomSetup">
      <div class="muted" style="margin-bottom:8px">還可以建立新的關係。建立者決定關係類型。</div>
      <label>新關係類型
        <select id="relation">
          <option value="lover">戀人</option>
          <option value="bestfriend">摯友</option>
          <option value="family">家人</option>
          <option value="partner">搭檔</option>
          <option value="rival">宿敵</option>
          <option value="enemy">仇敵</option>
        </select>
      </label>
      <button class="primary" id="createRoom" style="width:100%;margin-top:9px">建立新關係房間</button>
      <input id="joinCode" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="輸入對方給的 6 位房間碼" style="margin-top:10px">
      <button id="joinRoom" style="width:100%;margin-top:8px">加入對方的關係房間</button>
    </div>

    <div id="roomActive" class="hidden">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <div><b>目前關係房間：</b><span id="roomCode" class="chip"></span></div>
        <button id="disconnectRoom" class="danger">解除關係</button>
      </div>
      <div id="waiting" class="muted" style="margin-top:8px">等待另一位玩家加入……</div>
      <div id="partnerCard" class="partner hidden">
        <div id="partnerPic" class="partnerPic">♡</div>
        <div>
          <b id="partnerName"></b> <span id="relationChip" class="chip"></span>
          <div id="partnerStatus" class="small"></div>
          <div id="partnerStats" class="small"></div>
          <div id="relationBonus" class="bonus"></div>
        </div>
      </div>
      <div id="interactionGrid" class="interactions"></div>
    </div>
  </div>

  <div class="card">
    <div class="section">收到的互動</div>
    <div id="inbox" class="muted">目前沒有互動。</div>
  </div>

  <div class="card">
    <div class="section">聊天</div>
    <div id="chatBox" class="chat"><div class="muted">建立雙人房間後才能聊天。</div></div>
    <div class="chatInput"><input id="chatInput" maxlength="500" placeholder="輸入訊息……"><button class="primary" id="sendChat">送出</button></div>
  </div>

  <div class="card">
    <div class="section">待抉擇角色事件 <span id="eventCount" class="muted"></span></div>
    <div id="events"></div>
  </div>
  <div id="extraDaily" class="card pageCard"><div class="section">☀️ 今日小事</div><div id="dailyList"></div></div>
  <div id="extraShop" class="card pageCard"><div class="section">🏪 小商店</div><div id="shopList"></div></div>
  <div id="extraBag" class="card pageCard"><div class="section">🎒 背包</div><div id="bagList"></div></div>
  <div id="extraMemory" class="card pageCard"><div class="section">📖 回憶</div><div id="memoryList"></div></div>
  <div id="extraAchievements" class="card pageCard"><div class="section">🏆 成就</div><div id="achievementList"></div></div>
</section>
</div>

<div id="drawerShade" class="drawerShade hidden"></div><aside id="drawer" class="drawer hidden"><div style="padding:8px"><b id="drawerName">角色</b><div class="muted">功能選單</div></div><button class="navBtn" data-nav="life">🏠 角色生活</button><button class="navBtn" data-nav="daily">📋 今日小事</button><button class="navBtn" data-nav="relations">💞 關係</button><button class="navBtn" data-nav="chat">💬 聊天</button><div class="navSep"></div><button class="navBtn" data-nav="bag">🎒 背包</button><button class="navBtn" data-nav="shop">🏪 商店</button><button class="navBtn" data-nav="memory">📖 回憶</button><button class="navBtn" data-nav="achievements">🏆 成就</button><div class="navSep"></div><button class="navBtn" id="back">💾 返回存檔首頁</button></aside><div id="infoModal" class="modal hidden"><div class="modalBox"><h3 id="infoTitle"></h3><div id="infoBody"></div><button id="closeInfo" class="primary" style="width:100%;margin-top:12px">知道了</button></div></div>
<div id="gameModal" class="modal hidden">
  <div class="modalBox">
    <h3 style="margin:0">互動小遊戲：心有靈犀</h3>
    <div class="muted" style="margin-top:5px">兩個人各選一個答案，雙方選完後揭曉。</div>
    <div class="gameChoices">
      <button data-choice="甜點店">甜點店</button>
      <button data-choice="散步">散步</button>
      <button data-choice="看星星">看星星</button>
    </div>
    <div id="gameResult" class="gameResult">等待選擇……</div>
    <button id="closeGame" style="width:100%;margin-top:10px">關閉</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://uaanvqqjwfcfmecjhyjn.supabase.co";
const SUPABASE_KEY = "sb_publishable_h3YN0v-lcO0eW95UHuPkLw_KLZSoPY4";
const API = SUPABASE_URL + "/rest/v1";

const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

const LOCAL_KEY="role_life_v2";
const PLAYER_KEY="role_life_player_v2";

const defs={
  lover:{name:"戀人",bond:1.5,exp:1.25,desc:"羈絆×1.5、經驗×1.25",actions:[["抱抱","抱抱你"],["約會","邀請你去約會"],["撒嬌","跑來向你撒嬌"],["分享甜點","想和你分享甜點"],["說想你","說有點想你"],["互動小遊戲","game"]]},
  bestfriend:{name:"摯友",bond:1.35,exp:1.18,desc:"羈絆×1.35、經驗×1.18",actions:[["聊八卦","想找你聊八卦"],["出去玩","約你出去玩"],["分零食","分你一點零食"],["擊掌","向你伸手擊掌"],["打氣","替你加油"],["互動小遊戲","game"]]},
  family:{name:"家人",bond:1.4,exp:1.12,desc:"羈絆×1.4、經驗×1.12",actions:[["一起吃飯","叫你一起吃飯"],["關心","問你今天過得怎樣"],["陪伴","想陪你待一下"],["幫忙","說要幫你做點事"],["送伴手禮","帶了小東西給你"],["互動小遊戲","game"]]},
  partner:{name:"搭檔",bond:1.15,exp:1.3,desc:"經驗×1.3",actions:[["訓練","邀請你一起訓練"],["討論計畫","想和你討論計畫"],["交換情報","來交換情報"],["掩護","表示會替你掩護"],["慶祝","邀你慶祝一下"],["互動小遊戲","game"]]},
  rival:{name:"宿敵",bond:.8,exp:1.4,desc:"經驗×1.4，羈絆較慢",actions:[["挑戰","向你發起挑戰"],["比戰績","要和你比較戰績"],["挑釁","故意來挑釁你"],["再戰","丟下一句下次再戰"],["嘴硬稱讚","嘴硬地稱讚你"],["互動小遊戲","game"]]},
  enemy:{name:"仇敵",bond:.45,exp:1.32,desc:"經驗×1.32，羈絆很慢",actions:[["下戰帖","向你下戰帖"],["嘲諷","對你冷嘲熱諷"],["正面較量","邀你正面較量"],["警告","對你發出警告"],["宣戰","表示絕對不會認輸"],["互動小遊戲","game"]]}
};

const routines=[
  [0,6,"熟睡中","抱著被子安穩睡著。"],
  [6,7,"剛起床","還有點迷迷糊糊。"],
  [7,8,"吃早餐","正在吃早餐。"],
  [8,12,"做自己的事","工作、練習或處理今天的事。"],
  [12,13,"吃午餐","暫時休息吃午餐。"],
  [13,17,"繼續忙碌","午後繼續自己的生活。"],
  [17,18,"散步回家","慢慢走在回家的路上。"],
  [18,19,"吃晚餐","正在吃晚餐。"],
  [19,21,"悠閒時間","窩著休息。"],
  [21,22,"洗澡","洗去一天疲憊。"],
  [22,24,"準備睡覺","鑽進被窩準備睡了。"]
];

const eventPool=[
  ["突然想起對方",p=>`忙到一半時，你突然想起${p}。`,[["傳訊息",2],["晚點再說",0]]],
  ["看到小禮物",p=>`你看到一樣很適合${p}的小東西。`,[["買下來",3],["拍照給他看",2],["先記住",1]]],
  ["有點疲憊",p=>`今天有點累，你想到也許可以找${p}說說話。`,[["找他聊聊",2],["自己休息",1]]]
];

let local=loadLocal();
let playerId=localStorage.getItem(PLAYER_KEY);
if(!playerId){playerId=(crypto.randomUUID?crypto.randomUUID():"p"+Date.now()+Math.random().toString(16).slice(2));localStorage.setItem(PLAYER_KEY,playerId)}

let activeId=null, room=null, partner=null, pollTimer=null, gameId=null, activeRoomCode="", relationshipSummaries={};

function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY))||{characters:[]}}catch(e){return{characters:[]}}}
function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(local))}
function cur(){return local.characters.find(x=>x.id===activeId)}
function ensureRelations(c){
  if(!c)return;
  if(!Array.isArray(c.roomCodes))c.roomCodes=[];
  if(c.roomCode && !c.roomCodes.includes(c.roomCode))c.roomCodes.push(c.roomCode);
  c.roomCodes=[...new Set(c.roomCodes.filter(Boolean))].slice(0,3);
  delete c.roomCode;
}
function uuid(){return crypto.randomUUID?crypto.randomUUID():"id"+Date.now()+Math.random().toString(16).slice(2)}
function newChar(name){return{id:uuid(),name,level:1,exp:0,energy:90,mood:82,bond:0,image:"",start:new Date().toISOString().slice(0,10),events:[],lastEvent:Date.now(),roomCodes:[],hunger:85,money:300,inventory:{},memories:[],achievements:{},dailyDate:"",dailyDone:0}}
function routine(){let h=new Date().getHours();return routines.find(r=>h>=r[0]&&h<r[1])||routines[0]}
function day(c){let a=new Date(c.start+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.max(1,Math.floor((b-a)/86400000)+1)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function show(id){document.getElementById("home").classList.toggle("hidden",id!=="home");document.getElementById("game").classList.toggle("hidden",id!=="game")}
function publicState(c){let r=routine();return{name:c.name,image:c.image||"",level:c.level,energy:Math.round(c.energy),mood:Math.round(c.mood),activity:r[2],updated:Date.now()}}
function relDef(){return room?defs[room.relation]:null}
function fatal(msg){let f=document.getElementById("fatal");f.textContent=msg;f.classList.remove("hidden")}
function clearFatal(){document.getElementById("fatal").classList.add("hidden")}

async function api(path,options={}){
  const res=await fetch(API+path,{...options,headers:{...HEADERS,...(options.headers||{})}});
  const text=await res.text();
  let data=null;
  if(text){try{data=JSON.parse(text)}catch(e){data=text}}
  if(!res.ok){
    console.error("API error",res.status,data);
    throw new Error((data&&data.message)||("Supabase 錯誤 "+res.status));
  }
  return data;
}

function renderHome(){
  document.getElementById("saveCount").textContent=`${local.characters.length}/5`;
  let box=document.getElementById("saveList");box.innerHTML="";
  if(!local.characters.length)box.innerHTML='<div class="muted">還沒有角色，先創建一個吧。</div>';
  local.characters.forEach(c=>{
    ensureRelations(c);
    let d=document.createElement("div");d.className="save";

async function makeCode(){
  for(let i=0;i<15;i++){
    let code=String(Math.floor(100000+Math.random()*900000));
    let rows=await api(`/rooms?code=eq.${encodeURIComponent(code)}&select=code&limit=1`);
    if(!rows.length)return code;
  }
  throw new Error("無法產生房間碼，請再試一次。");
}

document.getElementById("joinRoom").onclick=async()=>{

    })});
    c.roomCodes.push(code);activeRoomCode=code;saveLocal();await refreshRelationships();await loadRoom(code);startPolling();

async function loadRoom(code){
  let rows=await api(`/rooms?code=eq.${encodeURIComponent(code)}&select=*`);
  if(!rows.length){
    let c=cur();
    if(c){ensureRelations(c);c.roomCodes=c.roomCodes.filter(x=>x!==code);saveLocal()}
    delete relationshipSummaries[code];
    if(activeRoomCode===code)activeRoomCode=(c?.roomCodes?.[0]||"");
    room=null;partner=null;renderGame();return;
  }
  room=rows[0];activeRoomCode=code;relationshipSummaries[code]=room;
  let c=cur();
  partner=room.host_char===c.id?room.guest_state:room.host_state;
  renderGame();
  await Promise.all([loadMessages(),loadInbox()]);
}

async function refreshRelationships(){
  let c=cur();if(!c)return;ensureRelations(c);
  relationshipSummaries={};
  const valid=[];
  for(const code of c.roomCodes){
    try{
      const rows=await api(`/rooms?code=eq.${encodeURIComponent(code)}&select=*`);
      if(rows.length){relationshipSummaries[code]=rows[0];valid.push(code)}
    }catch(e){console.warn(e)}
  }
  if(valid.length!==c.roomCodes.length){c.roomCodes=valid;saveLocal()}
  if(activeRoomCode && !valid.includes(activeRoomCode))activeRoomCode=valid[0]||"";
  renderGame();
}

async function syncState(){
  let c=cur();if(!c||!activeRoomCode||!room)return;
  let field=room.host_char===c.id?"host_state":"guest_state";
  let body={};body[field]=publicState(c);
  await api(`/rooms?code=eq.${encodeURIComponent(room.code)}`,{method:"PATCH",body:JSON.stringify(body)});
}

function startPolling(){
  stopPolling();
  pollTimer=setInterval(async()=>{
    try{
      let c=cur();if(!c)return;
      ensureRelations(c);
      await refreshRelationships();
      if(activeRoomCode)await loadRoom(activeRoomCode);
      else{room=null;partner=null;renderGame()}
    }catch(e){console.warn(e)}
  },2500);
}
function stopPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=null}

      d.actions.forEach(([label,key])=>{let b=document.createElement("button");b.textContent=label;b.dataset.act=key;grid.appendChild(b)});

function closeDrawer(){drawer.classList.add('hidden');drawerShade.classList.add('hidden')}menuBtn.onclick=()=>{drawer.classList.remove('hidden');drawerShade.classList.remove('hidden')};drawerShade.onclick=closeDrawer;
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let n=b.dataset.nav;closeDrawer();document.querySelectorAll('.pageCard').forEach(x=>x.classList.remove('active'));let map={daily:'extraDaily',bag:'extraBag',shop:'extraShop',memory:'extraMemory',achievements:'extraAchievements'};if(map[n]){document.getElementById(map[n]).classList.add('active');document.getElementById(map[n]).scrollIntoView({behavior:'smooth',block:'start'})}else if(n==='relations')document.getElementById('relationshipList').scrollIntoView({behavior:'smooth'});else if(n==='chat')document.getElementById('chatBox').scrollIntoView({behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'});pageTitle.textContent={life:'角色生活',daily:'今日小事',relations:'關係',chat:'聊天',bag:'背包',shop:'商店',memory:'回憶',achievements:'成就'}[n]||'角色生活'});
document.getElementById('bars').onclick=e=>{let k=e.target.dataset.info;if(!k)return;let c=cur(),d={energy:['⚡ 體力',`目前 ${Math.floor(c.energy)}/100。<br>低體力會讓角色優先休息，並影響外出、約會與冒險。`],hunger:['🍙 飽食度',`目前 ${Math.floor(c.hunger)}/100。<br>會隨時間下降；太餓會影響體力與心情，也會提高吃飯類事件機率。`],mood:['🌸 心情',`目前 ${Math.floor(c.mood)}/100。<br>會改變角色行動傾向與隨機事件池。低落時更容易出現安慰、陪伴、散心事件。`],exp:['✨ 經驗',`角色自己的成長值。升級後會逐步解鎖更多生活與 TRPG 內容。`]}[k];infoTitle.textContent=d[0];infoBody.innerHTML=d[1];infoModal.classList.remove('hidden')};closeInfo.onclick=()=>infoModal.classList.add('hidden');

window.addEventListener("error",e=>fatal("程式錯誤："+e.message));
renderHome();
</script>
</body>
