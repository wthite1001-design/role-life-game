async function sendMessage(){let c=cur(),t=chatInput.value.trim();if(!t||!room||!partner)return;await api("/messages",{method:"POST",body:JSON.stringify({room_code:room.code,from_char:c.id,text:t})});chatInput.value="";c.stats.messages++;logj(c,`傳了一則訊息給${partner.name}`,"💬");save();await loadMessages();renderAll()}sendChat.onclick=sendMessage;chatInput.onkeydown=e=>{if(e.key==="Enter")sendMessage()}
async function pollNotifications(){let c=cur();if(!c)return;let last=getLast(),u=getUnread();for(let code of c.roomCodes){try{let xs=await api(`/messages?room_code=eq.${code}&select=*&order=created_at.desc&limit=1`);if(!xs.length)continue;let m=xs[0];if(last[code]&&last[code]!==m.id&&m.from_char!==c.id){let r=rooms[code],o=r?(r.host_char===c.id?r.guest_state:r.host_state):null,chatOpen=!chatModal.classList.contains("hidden")&&activeRoom===code;if(!chatOpen){u[code]=(u[code]||0)+1;showNotify(`${o?.name||"關係角色"}傳來新訊息`,String(m.text).slice(0,55),"💬")}}last[code]=m.id}catch{}}setLast(last);setUnread(u);renderChatRooms(c)}
async function heartbeat(){let c=cur();for(let code of c.roomCodes){let r=rooms[code];if(!r)continue;let field=r.host_char===c.id?"host_state":"guest_state";try{await api(`/rooms?code=eq.${code}`,{method:"PATCH",body:JSON.stringify({[field]:publicState(c)})})}catch{}}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(async()=>{if(!cur())return;await heartbeat();await refreshRooms();await pollNotifications();if(activeRoom&&rooms[activeRoom]){room=rooms[activeRoom];partner=room.host_char===cur().id?room.guest_state:room.host_state;if(!chatModal.classList.contains("hidden"))await Promise.all([loadMessages(),loadInbox()])}renderAll()},5000)}
menuBtn.onclick=()=>{drawer.classList.remove("hidden");drawerShade.classList.remove("hidden")};drawerShade.onclick=()=>{drawer.classList.add("hidden");drawerShade.classList.add("hidden")};document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{drawer.classList.add("hidden");drawerShade.classList.add("hidden");document.getElementById(b.dataset.open).classList.remove("hidden");if(b.dataset.open==="chatModal"&&activeRoom)selectRoom(activeRoom);renderAll()});document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".modal").classList.add("hidden"));document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.add("hidden")});
backHome.onclick=()=>{clearInterval(pollTimer);activeId=null;activeRoom="";room=null;partner=null;drawer.classList.add("hidden");drawerShade.classList.add("hidden");document.querySelectorAll(".modal").forEach(m=>m.classList.add("hidden"));game.classList.add("hidden");home.classList.remove("hidden");renderHome()};
avatar.onclick=()=>imageInput.click();imageInput.onchange=e=>{let c=cur(),f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=v=>{let im=new Image();im.onload=()=>{let cv=document.createElement("canvas"),q=Math.min(1,360/Math.max(im.width,im.height));cv.width=im.width*q;cv.height=im.height*q;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);c.image=cv.toDataURL("image/jpeg",.7);save();renderAll()};im.src=v.target.result};rd.readAsDataURL(f)}
bgm.volume=Number(localStorage.getItem("roleLife_bgm_volume")||.25);bgmVolume.value=bgm.volume;bgmToggle.onclick=async()=>{if(bgm.paused){try{await bgm.play();bgmToggle.textContent="⏸ 暫停"}catch{alert("請把 bgm.mp3 與 index.html 放在同一資料夾。")}}else{bgm.pause();bgmToggle.textContent="▶ 播放"}};bgmVolume.oninput=()=>{bgm.volume=Number(bgmVolume.value);localStorage.setItem("roleLife_bgm_volume",bgm.volume)};
renderHome();
</script></body></html>
